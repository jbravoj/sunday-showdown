name: Test and deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Game rules tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Type-check and build Cloud Functions
        run: npm run build:functions

  deploy:
    # Only main deploys. Needs the FIREBASE_SERVICE_ACCOUNT_SUNDAY_SHOWDOWN_FE8EC
    # secret, which `firebase init hosting:github` creates; without it this
    # job skips instead of failing.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUNDAY_SHOWDOWN_FE8EC != '' }}
    steps:
      - if: env.HAS_DEPLOY_KEY != 'true'
        run: echo "No Firebase deploy key yet; run 'firebase init hosting:github' once. Skipping deploy."
      - if: env.HAS_DEPLOY_KEY == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_DEPLOY_KEY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.HAS_DEPLOY_KEY == 'true'
        run: npm install
      - if: env.HAS_DEPLOY_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUNDAY_SHOWDOWN_FE8EC }}
          channelId: live
          projectId: sunday-showdown-fe8ec
